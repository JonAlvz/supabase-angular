<div class="flex flex-col items-center gap-4">
  @if (_avatarUrl) {
    <img
      [src]="_avatarUrl"
      alt="Avatar"
      class="w-28 h-28 sm:w-36 sm:h-36 rounded-full object-cover ring-4 ring-blue-500 shadow-lg shadow-blue-900/30"
    />
  }

  @if (!_avatarUrl) {
    <div
      class="w-28 h-28 sm:w-36 sm:h-36 rounded-full bg-gray-700 flex items-center justify-center ring-4 ring-gray-600 shadow-lg"
    >
      <svg class="w-14 h-14 text-gray-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path
          stroke-linecap="round"
          stroke-linejoin="round"
          stroke-width="1.5"
          d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"
        />
      </svg>
    </div>
  }

  <button
    type="button"
    class="py-2 px-5 bg-blue-600 text-white text-sm font-medium rounded-lg hover:bg-blue-500 active:bg-blue-700 disabled:opacity-50 disabled:cursor-not-allowed transition-colors duration-200 cursor-pointer"
    (click)="singleInput.click()"
    [disabled]="uploading()"
  >
    {{ uploading() ? 'Uploading ...' : 'Upload avatar' }}
  </button>

  <input
    #singleInput
    class="hidden"
    type="file"
    id="single"
    accept="image/*"
    (change)="uploadAvatar($event)"
    [disabled]="uploading()"
  />
</div>
