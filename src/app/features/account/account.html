<form
  [formGroup]="updateProfileForm"
  (ngSubmit)="updateProfile()"
  class="flex flex-col gap-4 max-w-md mx-auto"
>
  <div class="flex flex-col gap-1">
    <label for="email" class="text-sm font-medium">Email</label>
    <input
      id="email"
      type="text"
      [value]="user().email"
      disabled
      class="border border-gray-300 rounded px-3 py-2 bg-gray-100 text-gray-500 cursor-not-allowed"
    />
  </div>
  <div class="flex flex-col gap-1">
    <label for="username" class="text-sm font-medium">Name</label>
    <input
      formControlName="username"
      id="username"
      type="text"
      class="border border-gray-300 rounded px-3 py-2 focus:outline-none focus:ring-2 focus:ring-blue-500"
    />
  </div>
  <div class="flex flex-col gap-1">
    <label for="website" class="text-sm font-medium">Website</label>
    <input
      formControlName="website"
      id="website"
      type="url"
      class="border border-gray-300 rounded px-3 py-2 focus:outline-none focus:ring-2 focus:ring-blue-500"
    />
  </div>

  <div>
    <button
      type="submit"
      class="w-full py-2 px-4 bg-blue-600 text-white rounded hover:bg-blue-700 disabled:opacity-50"
      [disabled]="loading()"
    >
      {{ loading() ? 'Loading ...' : 'Update' }}
    </button>
  </div>

  <div>
    <button class="w-full py-2 px-4 bg-gray-200 rounded hover:bg-gray-300" (click)="signOut()">
      Sign Out
    </button>
  </div>
</form>
