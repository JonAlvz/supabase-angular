<div class="flex justify-center items-center min-h-screen bg-gray-900 px-4">
  <div
    class="w-full max-w-md bg-gray-300 p-6 rounded-lg border-2 border-blue-600"
    aria-live="polite"
  >
    <h1 class="text-2xl font-bold mb-2">Your account</h1>
    <p class="text-gray-600 mb-6">Update your profile details and avatar</p>

    <form [formGroup]="updateProfileForm" (ngSubmit)="updateProfile()" class="flex flex-col gap-4">
      <div class="flex justify-center">
        <app-avatar [avatarUrl]="this.avatarUrl" (upload)="updateAvatar($event)"></app-avatar>
      </div>

      <div class="flex flex-col gap-1">
        <label for="email" class="text-sm font-medium">Email</label>
        <input
          id="email"
          type="text"
          [value]="user()?.email ?? ''"
          disabled
          class="border border-blue-600 rounded px-3 py-2 bg-gray-100 text-gray-500 cursor-not-allowed"
        />
      </div>

      <div class="flex flex-col gap-1">
        <label for="username" class="text-sm font-medium">Name</label>
        <input
          formControlName="username"
          id="username"
          type="text"
          class="border border-blue-600 rounded px-3 py-2 focus:outline-none focus:ring-2 focus:ring-blue-500"
        />
      </div>

      <div class="flex flex-col gap-1">
        <label for="website" class="text-sm font-medium">Website</label>
        <input
          formControlName="website"
          id="website"
          type="url"
          class="border border-blue-600 rounded px-3 py-2 focus:outline-none focus:ring-2 focus:ring-blue-500"
        />
      </div>

      <div>
        <button
          type="submit"
          class="w-full py-2 px-4 bg-blue-600 text-white rounded hover:bg-blue-800 disabled:opacity-50 cursor-pointer"
          [disabled]="loading()"
        >
          {{ loading() ? 'Loading ...' : 'Update profile' }}
        </button>
      </div>

      <div>
        <button
          type="button"
          class="w-full py-2 px-4 bg-gray-900 text-white rounded hover:bg-black cursor-pointer"
          (click)="signOut()"
        >
          Sign Out
        </button>
      </div>
    </form>
  </div>
</div>
