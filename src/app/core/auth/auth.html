<div
  class="min-h-screen bg-linear-to-br from-gray-950 via-gray-900 to-gray-800 flex items-center justify-center px-4 py-12"
>
  <div class="w-full max-w-md" aria-live="polite">
    <!-- Card -->
    <div
      class="bg-gray-800/80 backdrop-blur-sm rounded-2xl shadow-2xl border border-gray-700/60 p-8"
    >
      <div class="text-center mb-8">
        <h1 class="text-3xl font-bold text-white tracking-tight">Supabase + Angular</h1>
        <p class="text-gray-400 mt-2 text-sm">Sign in via magic link with your email below</p>
      </div>
      <form [formGroup]="signInForm" (ngSubmit)="onSubmit()" class="flex flex-col gap-5">
        <div class="flex flex-col gap-1.5">
          <label for="email" class="text-sm font-medium text-gray-300">Email address</label>
          <input
            appAutofocus
            id="email"
            formControlName="email"
            class="bg-gray-700/80 border border-gray-600 text-white rounded-lg px-4 py-2.5 placeholder-gray-500 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent transition duration-200"
            type="email"
            placeholder="you@example.com"
          />
        </div>

        <button
          type="submit"
          class="w-full py-2.5 px-4 bg-blue-600 text-white font-semibold rounded-lg hover:bg-blue-500 active:bg-blue-700 disabled:opacity-50 disabled:cursor-not-allowed transition-colors duration-200 cursor-pointer"
          [disabled]="loading()"
        >
          {{ loading() ? 'Sending...' : 'Send magic link' }}
        </button>
      </form>
    </div>
  </div>
</div>
